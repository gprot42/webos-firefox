# Meson cross file: 32-bit ARMv7 softfp against the buildroot-nc4 SDK
# (glibc 2.12), for the adapter library when building with build/mozconfig-nc4.
[constants]
sysroot = '/work/nc4/out/host/arm-webos-linux-gnueabi/sysroot'
gcc = '/work/nc4/out/host/lib/gcc/arm-webos-linux-gnueabi/16.2.0'

[binaries]
c = ['clang-19', '--target=arm-linux-gnueabi', '--sysroot=' + sysroot, '--gcc-install-dir=' + gcc, '-march=armv7-a', '-mthumb', '-mfpu=neon', '-mfloat-abi=softfp']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-fuse-ld=lld', '-pthread']

[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot + '/usr/lib/pkgconfig', sysroot + '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
