# Meson cross file: the adapter library built with the buildroot-nc4 GNU
# toolchain (GCC 16.2, GNU ld), like every library in the SDK.
[constants]
nc4 = '/work/nc4/out/host'
sysroot = nc4 + '/arm-webos-linux-gnueabi/sysroot'

[binaries]
c = [nc4 + '/bin/arm-webos-linux-gnueabi-gcc', '-march=armv7-a', '-mthumb', '-mfpu=neon', '-mfloat-abi=softfp']
ar = nc4 + '/bin/arm-webos-linux-gnueabi-ar'
strip = nc4 + '/bin/arm-webos-linux-gnueabi-strip'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-pthread']

[properties]
sys_root = sysroot
pkg_config_libdir = [sysroot + '/usr/lib/pkgconfig', sysroot + '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
