# Meson cross file: 32-bit ARMv7 softfp against the Debian 11 armel sysroot.
[binaries]
c = ['clang-19', '--target=arm-linux-gnueabi', '--sysroot=/work/sysroot-armel', '-march=armv7-a', '-mthumb', '-mfpu=neon', '-mfloat-abi=softfp']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-fuse-ld=lld']

[properties]
sys_root = '/work/sysroot-armel'
pkg_config_libdir = ['/work/sysroot-armel/usr/lib/arm-linux-gnueabi/pkgconfig', '/work/sysroot-armel/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
