# Meson cross file: the adapter for the webOS 4 emulator test build
# (32-bit x86, Debian 12 i386 sysroot from build/emu/sysroot-i386.sh).
[binaries]
c = ['clang-19', '--target=i686-linux-gnu', '--sysroot=/work/sysroot-i386']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[built-in options]
c_link_args = ['-fuse-ld=lld']

[properties]
sys_root = '/work/sysroot-i386'
pkg_config_libdir = ['/work/sysroot-i386/usr/lib/i386-linux-gnu/pkgconfig', '/work/sysroot-i386/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
